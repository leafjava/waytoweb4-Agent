<script>
(()=>{const root=document.documentElement,header=document.querySelector('.header'),toggle=document.querySelector('.menu-toggle'),navigation=document.getElementById('tablet-navigation'),card=document.querySelector('.demo-card'),video=document.querySelector('.background');const visible=()=>getComputedStyle(toggle).display!=='none';function close(focus){header.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false');if(visible())navigation.setAttribute('inert','');else navigation.removeAttribute('inert');if(focus)toggle.focus()}function sync(){if(visible()){if(!header.classList.contains('menu-open'))navigation.setAttribute('inert','')}else close(false)}toggle.addEventListener('click',()=>{const open=!header.classList.contains('menu-open');header.classList.toggle('menu-open',open);toggle.setAttribute('aria-expanded',String(open));if(open){navigation.removeAttribute('inert');requestAnimationFrame(()=>navigation.querySelector('a').focus())}else close(true)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&header.classList.contains('menu-open'))close(true)});document.addEventListener('pointerdown',e=>{if(header.classList.contains('menu-open')&&!header.contains(e.target))close(false)});navigation.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>close(false)));document.querySelectorAll('.play,.watch-button').forEach(b=>b.addEventListener('click',()=>video.paused?video.play().catch(()=>{}):video.pause()));card.addEventListener('animationend',e=>{if(e.animationName==='entrance-card'){root.classList.remove('motion-pending');clearTimeout(window.__motionFallback)}},{once:true});addEventListener('resize',sync,{passive:true});sync()})();
</script>
