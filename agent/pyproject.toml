[project]
name = "waytoweb4-agent"
version = "0.1.0"
description = "Follow Agent + RedLine Agent for the waytoweb4 copy-trading hackathon project."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"